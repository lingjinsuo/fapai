<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
            line-height: 1.6;
        }
        .layout { display: flex; flex-direction: column; height: 100vh; }
        .top-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .top-bar .system-title { font-size: 22px; font-weight: bold; letter-spacing: 1px; }
        .top-bar .system-desc { font-size: 13px; margin-top: 4px; opacity: 0.9; }
        .main { display: flex; flex: 1; min-height: 0; }
        .sidebar {
            width: 220px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            padding: 20px 0;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar .menu-group-title {
            padding: 8px 20px;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar a.menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            font-size: 15px;
            border-left: 3px solid transparent;
            transition: all 0.2s;
        }
        .sidebar a.menu-item:hover { background: #f5f6fa; color: #667eea; }
        .sidebar a.menu-item.active {
            background: linear-gradient(90deg, #f0f2ff 0%, #ffffff 100%);
            color: #667eea;
            border-left-color: #667eea;
            font-weight: 600;
            box-shadow: inset 2px 0 6px rgba(102, 126, 234, 0.15);
        }
        .sidebar a.menu-item .icon { margin-right: 10px; font-size: 16px; }
        .content { flex: 1; padding: 24px; overflow: auto; }
        .content-header { margin-bottom: 16px; }
        .content-header h2 { font-size: 20px; color: #333; }
        .content-header p { font-size: 13px; color: #888; margin-top: 4px; }
        .stats-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .stat-card {
            background: #fff; padding: 16px 20px; border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06); flex: 1; min-width: 160px;
        }
        .stat-card .label { font-size: 13px; color: #888; }
        .stat-card .value { font-size: 22px; font-weight: bold; color: #333; margin-top: 4px; }
        .stat-card.primary .value { color: #667eea; }
        .stat-card.success .value { color: #28a745; }
        .stat-card.warning .value { color: #f39c12; }
        .stat-card.danger .value { color: #e74c3c; }
        .panel {
            background: #fff; padding: 20px; border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .panel h3 { margin-bottom: 12px; font-size: 16px; color: #333; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
        .toolbar input, .toolbar select {
            padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 13px; outline: none;
        }
        .toolbar input:focus, .toolbar select:focus { border-color: #667eea; }
        .btn {
            padding: 7px 14px; border: none; border-radius: 4px;
            font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-primary:hover { background: #5468d3; }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e2e2e2; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.data th, table.data td {
            padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left;
            vertical-align: top;
        }
        table.data th { background: #f7f8fc; color: #555; font-weight: 600; }
        table.data tr:hover td { background: #fafbff; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-doing { background: #d4edda; color: #155724; }
        .badge-todo  { background: #cce5ff; color: #004085; }
        .badge-done  { background: #f8d7da; color: #721c24; }
        .badge-closed { background: #e2e3e5; color: #383d41; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-failed { background: #f8d7da; color: #721c24; }
        .badge-partial { background: #fff3cd; color: #856404; }
        .log-panel {
            background: #1e1e1e; color: #dcdcdc;
            font-family: Menlo, Consolas, monospace; font-size: 12px;
            padding: 14px; border-radius: 6px;
            height: calc(100vh - 220px); overflow-y: auto;
            white-space: pre-wrap; line-height: 1.6;
        }
        .empty-tip { text-align: center; padding: 40px 0; color: #888; }
        a { color: #667eea; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; align-items: center; justify-content: center; z-index: 999;
        }
        .modal-bg.show { display: flex; }
        .modal {
            background: #fff; border-radius: 8px; padding: 24px;
            width: 460px; max-width: 90vw;
        }
        .modal h3 { margin-bottom: 16px; font-size: 16px; }
        .modal .form-row { margin-bottom: 12px; }
        .modal label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
        .modal input, .modal textarea, .modal select {
            width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 13px; outline: none;
        }
        .modal-actions { text-align: right; margin-top: 14px; }
        .modal-actions .btn { margin-left: 8px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="layout">
    <div class="top-bar">
        <div class="system-title">{{ app_name }}</div>
        <div class="system-desc">淘宝 / 阿里资产法拍标的监控与归档平台</div>
    </div>
    <div class="main">
        <div class="sidebar">
            <div class="menu-group-title">导航菜单</div>
            <a href="/fp-items" class="menu-item {% if active_menu == 'fp-items' %}active{% endif %}">
                <span class="icon">📦</span> 标的列表
            </a>
            <a href="/fp-keys" class="menu-item {% if active_menu == 'fp-keys' %}active{% endif %}">
                <span class="icon">🔖</span> 监控关键词
            </a>
            <a href="/fp-logs" class="menu-item {% if active_menu == 'fp-logs' %}active{% endif %}">
                <span class="icon">📜</span> 实时日志
            </a>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>

<div class="modal-bg" id="modalBg">
    <div class="modal">
        <h3 id="modalTitle">标题</h3>
        <div id="modalBody"></div>
        <div class="modal-actions">
            <button class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn btn-primary" id="modalOk">确定</button>
        </div>
    </div>
</div>

<script>
function showModal(title, bodyHtml, onOk) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modalBg').classList.add('show');
    const okBtn = document.getElementById('modalOk');
    okBtn.onclick = () => { if (onOk) onOk(); closeModal(); };
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
function fmtDate(v) {
    if (!v) return '';
    return String(v).replace('T', ' ').substring(0, 19);
}
function statusBadge(s) {
    if (!s) return '<span class="badge">-</span>';
    return '<span class="badge badge-' + s + '">' + s + '</span>';
}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
