{% extends 'base.html' %}
{% block content %}
<div class="content-header">
    <h2>📜 实时日志</h2>


<div class="panel" style="margin-top:16px;">
    <h3>🔧 调试：抓取指定 URL（不入库）</h3>
    <div class="toolbar">
        <input type="text" id="debugUrl" placeholder="粘贴完整 URL，例如：https://sf.taobao.com/item_list.htm?q=..." style="flex:1;min-width:400px;">
        <button class="btn btn-primary" onclick="debugFetch()">抓取并打印</button>
    </div>
    <p style="font-size:12px;color:#888;margin-top:4px;">
        用途：把任意淘宝法拍 URL 粘贴过来，可以查看响应大小、items 条数、状态分布、原始数据。
        此操作<b>不会修改数据库</b>，仅调试用。
    </p>
</div>


    <p>通过 SSE 推送抓取任务的实时输出。</p>
</div>

<div class="panel">
    <div class="toolbar">
        <label><input type="checkbox" id="autoScroll" checked> 自动滚动到底部</label>
        <button class="btn btn-secondary" onclick="clearLog()">清屏</button>
        <button class="btn btn-primary" onclick="connect()">重新连接</button>
        <span style="flex:1;"></span>
        <a class="btn btn-secondary" href="/api/fp/logs/stream" target="_blank">在浏览器原生 EventSource 中打开</a>
    </div>
    <div class="log-panel" id="logPanel"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let es;
const panel = document.getElementById('logPanel');
function append(line) {
function debugFetch() {
    const url = document.getElementById('debugUrl').value.trim();
    if (!url) { alertMsg('请粘贴 URL'); return; }
    fetch('/api/fp/debug-fetch', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url: url})
    }).then(r => r.json()).then(res => { alertMsg(res.msg); });
}
function clearLog() { panel.textContent = ''; }
    const ts = new Date().toLocaleTimeString();
    panel.textContent += `[${ts}] ${line}\n`;
    if (document.getElementById('autoScroll').checked) {
        panel.scrollTop = panel.scrollHeight;
    }
}
function clearLog() { panel.textContent = ''; }
function connect() {
    if (es) es.close();
    es = new EventSource('/api/fp/logs/stream');
    es.onmessage = (e) => {
        if (e.data === 'connected' || e.data === 'heartbeat') return;
        append(e.data);
    };
    es.onerror = () => {
        append('--- 连接异常，3秒后重试 ---');
        setTimeout(connect, 3000);
    };
    append('--- 已建立连接 ---');
}
connect();
</script>
{% endblock %}
